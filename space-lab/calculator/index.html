<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калкулатор на тегло</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🌍 Калкулатор на тегло на планетите</h1>

    <p>
        Въведи теглото си на Земята и избери планета.
    </p>

    <input
        type="number"
        id="weight"
        placeholder="Тегло на Земята (кг)"
    >

    <select id="planet">
        <option value="0.38">Меркурий</option>
        <option value="0.91">Венера</option>
        <option value="1">Земя</option>
        <option value="0.38">Марс</option>
        <option value="2.34">Юпитер</option>
        <option value="1.06">Сатурн</option>
        <option value="0.92">Уран</option>
        <option value="1.19">Нептун</option>
    </select>

    <button onclick="calculate()">
        Изчисли
    </button>

    <div id="result"></div>

    <a href="../" class="back">
        ⬅ Обратно към главното меню
    </a>

</div>

<script src="script.js"></script>

</body>
</html>
