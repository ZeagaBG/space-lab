<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галактически свят | Обратна връзка</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="form-wrapper">
    <div class="form-header">
        <h2>Обратна връзка</h2>
        <p>Споделете своето мнение или ни оценете!</p>
    </div>
<!---->
    <form class="form" action="https://formbold.com/s/3OOjO" method="POST">

        <div class="form-group">
        <label for="email"><span class="required">*</span>Имейл:</label>
        <input type="email" id="email" name="Email" placeholder="example@mail.com" required />
        </div>

        <div class="form-group">
        <label for="message"><span class="required">*</span>Съобщение:</label>
        <textarea id="message" name="Message" placeholder="Вашето съобщение тук..." required></textarea>
        </div>

        <div class="form-group rating-group">
        <label>Оценете ни!</label>
        <div class="star-rating">
            <input type="radio" id="star5" name="Rating" value="5 stars (5/5)" />
            <label for="star5" title="5 звезди">★</label>

            <input type="radio" id="star4" name="Rating" value="4 stars (4/5)" />
            <label for="star4" title="4 звезди">★</label>

            <input type="radio" id="star3" name="Rating" value="3 stars (3/5)" />
            <label for="star3" title="3 звезди">★</label>

            <input type="radio" id="star2" name="Rating" value="2 stars (2/5)" />
            <label for="star2" title="2 звезди">★</label>

            <input type="radio" id="star1" name="Rating" value="1 star (1/5)" />
            <label for="star1" title="1 звезда">★</label>
        </div>
        </div>

        <button type="submit" class="btn btn-primary submit-btn">Изпрати</button>
    </form>
    </div>
</body>
</html>
